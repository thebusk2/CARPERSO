  <text x="247" y="577" font-size="8" fill="#78909C" text-anchor="middle">Teléfono</text>
  
  <rect x="290" y="528" width="55" height="55" rx="12" fill="#0A1E36" stroke="#1565C0" stroke-width="1"/>
  <text x="317" y="560" font-size="24" text-anchor="middle">🚦</text>
  <text x="317" y="577" font-size="8" fill="#78909C" text-anchor="middle">Waze</text>

