  <rect x="0" y="500" width="1024" height="1" fill="#1565C0" opacity="0.5"/>
  
  <text x="40" y="522" font-size="10" fill="#546E7A" letter-spacing="2">DOCK — APPS ANCLADAS</text>
  
  <!-- Apps ancladas en dock -->
