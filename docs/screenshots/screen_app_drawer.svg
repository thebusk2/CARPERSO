  <text x="107" y="577" font-size="8" fill="#78909C" text-anchor="middle">WhatsApp</text>
  
  <rect x="150" y="528" width="55" height="55" rx="12" fill="#0A1E36" stroke="#1565C0" stroke-width="1"/>
  <text x="177" y="560" font-size="24" text-anchor="middle">🗺</text>
  <text x="177" y="577" font-size="8" fill="#78909C" text-anchor="middle">Maps</text>
  
  <rect x="220" y="528" width="55" height="55" rx="12" fill="#0A1E36" stroke="#1565C0" stroke-width="1"/>
